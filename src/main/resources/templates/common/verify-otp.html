<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEEP - Forgot Password</title>
  <link rel="icon" href="/admin/images/DEEP Logo.png" type="image/png">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen" style="background: linear-gradient(to bottom, #FFFFFF, #D4DFED);">

<div id="toast-error"
     class="hidden fixed top-6 right-6 z-[10] max-w-xs text-sm text-white rounded-xl shadow-lg"
     role="alert" tabindex="-1" aria-labelledby="hs-toast-solid-color-red-label"
     style="position: fixed !important;">
  <div id="hs-toast-solid-color-red-label"
       class="flex p-4 gap-2 items-start rounded-xl">
    <span id="toast-message"></span>
  </div>
</div>

<div class="mx-auto">
  <!-- Header -->
  <div th:replace="~{common/student-authenticate-navbar::student-authenticate-navbar}"></div>
</div>

<main class="flex items-center justify-center min-h-[calc(100vh-60px)] p-5">
  <div class="w-full max-w-5xl bg-[#8EB4FF] rounded-4xl shadow-2xl overflow-hidden">
    <div class="flex flex-col sm:flex-row min-h-[600px]">
      <!-- Left Side - forgot Password Form -->
      <div class="flex-5 form-gradient p-8 lg:p-12 flex flex-col justify-center">
        <div class="max-w-sm mx-auto w-full">
          <h2 class="text-center text-3xl lg:text-4xl font-bold text-gray-800 mb-2">OTP Verification</h2>
          <p class="text-center text-gray-600 text-xs mb-1">We have sent an OTP to your DAU E-mail.</p>
          <p class="text-center text-gray-600 text-xs mb-8">Check Your E-mail and Get Started!</p>

          <form class="space-y-6" action="/verify-otp" method="post">
            <!-- Hidden Username Input -->
            <input type="hidden" name="username" value="test_user" />

            <!-- Hidden OTP Input (this will contain the final combined OTP) -->
            <input type="hidden" name="otp" id="combined_otp" />

            <!-- 6-Digit OTP Input Boxes -->
            <div class="relative z-0 w-full mb-5 group">
              <div class="flex justify-between space-x-2">
                <input
                        type="text"
                        maxlength="1"
                        class="otp-input w-12 h-12 text-center text-lg font-semibold border-2 border-gray-300 rounded-lg
                               focus:border-blue-600 focus:outline-none focus:ring-1 focus:ring-blue-500
                               dark:border-gray-600 dark:focus:border-blue-500 dark:focus:ring-blue-500"
                        data-index="0"
                />
                <input
                        type="text"
                        maxlength="1"
                        class="otp-input w-12 h-12 text-center text-lg font-semibold border-2 border-gray-300 rounded-lg
                               focus:border-blue-600 focus:outline-none focus:ring-1 focus:ring-blue-500
                               dark:border-gray-600 dark:focus:border-blue-500 dark:focus:ring-blue-500"
                        data-index="1"
                />
                <input
                        type="text"
                        maxlength="1"
                        class="otp-input w-12 h-12 text-center text-lg font-semibold border-2 border-gray-300 rounded-lg
                               focus:border-blue-600 focus:outline-none focus:ring-1 focus:ring-blue-500
                               dark:border-gray-600 dark:focus:border-blue-500 dark:focus:ring-blue-500"
                        data-index="2"
                />
                <input
                        type="text"
                        maxlength="1"
                        class="otp-input w-12 h-12 text-center text-lg font-semibold border-2 border-gray-300 rounded-lg
                               focus:border-blue-600 focus:outline-none focus:ring-1 focus:ring-blue-500
                               dark:border-gray-600 dark:focus:border-blue-500 dark:focus:ring-blue-500"
                        data-index="3"
                />
                <input
                        type="text"
                        maxlength="1"
                        class="otp-input w-12 h-12 text-center text-lg font-semibold border-2 border-gray-300 rounded-lg
                               focus:border-blue-600 focus:outline-none focus:ring-1 focus:ring-blue-500
                               dark:border-gray-600 dark:focus:border-blue-500 dark:focus:ring-blue-500"
                        data-index="4"
                />
                <input
                        type="text"
                        maxlength="1"
                        class="otp-input w-12 h-12 text-center text-lg font-semibold border-2 border-gray-300 rounded-lg
                               focus:border-blue-600 focus:outline-none focus:ring-1 focus:ring-blue-500
                               dark:border-gray-600 dark:focus:border-blue-500 dark:focus:ring-blue-500"
                        data-index="5"
                />
              </div>
            </div>

            <!-- Verify Button -->
            <button
                    type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg cursor-pointer"
            >
              Verify OTP
            </button>
          </form>

          <!-- Resend Link -->
          <div class="text-center mt-3 text-sm text-gray-700">
            <p class="mb-2">
              Didn't receive the OTP?
            </p>

            <!-- Timer message -->
            <div id="timerMessage" class="text-gray-500 mb-2">
              You can request to resend the OTP after
              <span id="countdown" class="font-semibold text-blue-600">2:00</span>
            </div>

            <!-- Resend OTP link -->
            <form id="resendForm" method="POST">
              <!-- Hidden token field -->
              <input type="hidden" name="random" id="resendToken" />

              <!-- Resend OTP link -->
              <a id="resendLink"
                 href="#"
                 onclick="handleResendClick(event)"
                 class="inline-block text-blue-600 hover:text-blue-700 font-semibold underline cursor-pointer transition duration-300"
                 style="display: none;"
              >
                Resend OTP
              </a>
            </form>
          </div>
        </div>
      </div>

      <!-- Right Side - Security Illustration -->
      <div class="hidden sm:flex relative flex-3 bg-[linear-gradient(to_bottom,_#3F6498_0%,_#212F89_50%,_#06007B_100%)] p-8 lg:p-12 flex items-center justify-center relative overflow-hidden">
        <img src="/student/images/verify-otp.svg " alt="otp img" class="relative scale-125 sm:scale-120 transition-transform duration-500">
      </div>
    </div>
  </div>
</main>

<script src="/student/js/verify-otp.js"></script>
</body>
</html>
