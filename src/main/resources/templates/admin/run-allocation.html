<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEEP - Run Allocation</title>
    <link rel="icon" href="/admin/images/DEEP Logo.png" type="image/png">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
</head>

<body class="min-h-screen" style="background: linear-gradient(to bottom, #FFFFFF, #D4DFED);">
<div class="mx-auto">
    <!-- Header -->
    <div th:replace="~{common/admin-navbar::admin-navbar}"></div>

    <!-- Welcome Section -->
    <main class="backdrop-blur-lg px-7 py-6">
        <div class="mx-auto">
            <div class="bg-white rounded-2xl py-2 px-4 md:px-8 mb-6"
                 style="box-shadow: 0px 2px 27px -5px rgba(0,0,0,0.2);">
                <h1 class="text-xl lg:text-2xl font-bold text-[#1E3C72]">
                    Run Allocation
                </h1>
            </div>

            <!-- Main Content Grid -->
            <div class="flex flex-col lg:flex-row gap-y-6 lg:gap-x-6 mb-6">
                <!-- Left Card - Allocate Courses -->
                <div class="flex-1 bg-white rounded-2xl shadow-md px-4 py-6 md:p-6" style="box-shadow: 0px 2px 27px -5px rgba(0,0,0,0.2);">
                    <!-- Card Header -->
                    <div class="flex items-center mb-6">
                        <img src="/admin/images/allocate-courses.svg" alt="Allocate Courses Icon" class="w-7 h-7 mt-[-13px] mr-1">
                        <div>
                            <h2 class="text-xl font-bold text-[#1E3C72]">Allocate Courses</h2>
                            <p class="text-xs text-gray-500">Initiate the course allocation</p>
                        </div>
                    </div>

                    <form id="allocationForm" method="POST">
                        <div class="mb-6 ml-8">
                            <label class="block text-lg font-bold text-[#1E3C72] mb-2">Select Semester :</label>
                            <div class="flex flex-wrap gap-2" id="semesterButtons">
                                <button type="button" class="semester-btn circles w-11 h-11 rounded-full text-white text-xl font-medium cursor-pointer bg-[#2D9D5D]" data-sem="5">5</button>
                                <button type="button" class="semester-btn circles w-11 h-11 rounded-full text-white text-xl font-medium cursor-pointer bg-[#1E3C72]" data-sem="6">6</button>
                                <button type="button" class="semester-btn circles w-11 h-11 rounded-full text-white text-xl font-medium cursor-pointer bg-[#1E3C72]" data-sem="7">7</button>
                                <button type="button" class="semester-btn circles w-11 h-11 rounded-full text-white text-xl font-medium cursor-pointer bg-[#1E3C72]" data-sem="8">8</button>
                            </div>
                        </div>

                        <input type="hidden" id="selectedSemester" name="semester" value="5" />

                        <button id="executeBtn"
                                type="submit"
                                class="w-full max-w-48 ml-8 bg-gradient-to-r from-[#27AE60] to-[#2ECC71] text-white px-2 py-2 rounded-xl font-medium flex items-center justify-center cursor-pointer">
                            <img src="/admin/images/execute-allocation.svg" alt="Execute Icon" class="w-7 h-7 mr-2">
                            Execute Allocation
                        </button>
                    </form>
                </div>

                <!-- Right Card - Allocation Summary -->
                <div class="flex-2 bg-white rounded-2xl shadow-md px-4 py-6 sm:px-6 sm:py-5" style="box-shadow: 0px 2px 27px -5px rgba(0,0,0,0.2);">
                    <!-- Card Header -->
                    <div class="flex items-center mb-6">
                        <img src="/admin/images/allocation-summary.svg" alt="Allocation Summary Icon" class="w-6 h-6 mt-1 mr-1">
                        <h2 class="text-xl font-bold text-[#1E3C72]">Allocation Summary</h2>
                    </div>

                    <!-- Summary Cards -->
                    <div class="flex flex-col sm:flex-row gap-6 justify-between">
                        <!-- Allocation Status -->
                        <div class="bg-[#AADAF9] flex-1 flex flex-col justify-center items-center rounded-2xl mx-4 sm:mx-0 px-6 text-center min-h-[170px]">
                            <div class="mb-6">
                                <span class="text-xl font-bold text-black ">Allocation Status</span>
                            </div>
                            <div class="bg-gradient-to-r from-[#27AE60] to-[#2ECC71] text-white px-7 py-2 rounded-xl font-medium text-lg">
                                Success
                            </div>
                        </div>

                        <!-- Total Students Allocated -->
                        <div class="bg-[#AADAF9] flex-1 flex flex-col justify-center items-center rounded-2xl mx-4 sm:mx-0 px-6 text-center min-h-[170px]">
                            <div class="mb-4">
                                <span class="text-xl font-bold text-black ">Students Successfully Allocated</span>
                            </div>
                            <div class="text-5xl font-bold text-gray-800">130</div>
                        </div>

                        <!-- Students Not Allocated -->
                        <div class="bg-[#AADAF9] flex-1 flex flex-col justify-center items-center rounded-2xl mx-4 sm:mx-0 px-6 text-center min-h-[170px]">
                            <div class="mb-4">
                                <span class="text-xl font-bold text-black ">Students Unsuccessfully Allocated</span>
                            </div>
                            <div class="text-5xl font-bold text-gray-800">8</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Download Reports Button -->
            <div class="mb-6 flex justify-center sm:block">
                <button class="bg-[#1E3C72] text-white px-4 py-3 rounded-lg font-medium flex text-md items-center cursor-pointer">
                    <img src="/admin/images/link.svg" alt="Download Icon" class="w-6 h-6 mr-2">
                    Download Reports
                </button>
            </div>
        </div>
    </main>
</div>

<script src="/admin/js/run-allocation.js"></script>
</body>
</html>
