<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEEP - Update Instance</title>
    <link rel="icon" href="/admin/images/DEEP Logo.png" type="image/png">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen" style="background: linear-gradient(to bottom, #FFFFFF, #D4DFED);">

<!-- Toast Display -->
<div th:replace="~{common/toast-display::toast-display}"></div>

<div class="mx-auto">
    <!-- Header -->
    <div th:replace="~{common/admin-navbar::admin-navbar}"></div>

    <!-- Main Content -->
    <main class="backdrop-blur-lg rounded-3xl px-7 py-4">
        <div class="bg-white rounded-2xl py-2 px-4 md:px-8 mb-4"
             style="box-shadow: 0px 2px 27px -5px rgba(0,0,0,0.2);">
            <h1 class="text-xl lg:text-2xl font-bold text-[#1E3C72]">
                Configure Allocation Instance
            </h1>
        </div>


        <!-- Submission Status -->
        <section class="bg-[#B8D7FF] rounded-2xl px-8 py-4 mb-4" style="box-shadow: 0px 2px 27px -5px rgba(0,0,0,0.2);">
            <div class="flex items-center gap-3 mb-6 lg:mb-8">
                <img src="/admin/images/external-link.png" alt="Link Img" class="w-5 h-5 lg:w-5 lg:h-5">
                <h2 class="text-xl lg:text-2xl font-bold text-[#1E3C72]">Submission Status</h2>
            </div>

            <!-- Semesters Grid -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-y-7 md:gap-y-6 gap-x-2 md:gap-x-6 mb-4">
                <!-- Semester Status -->
                <div th:each="entry : ${uploadStatus.entrySet()}" class="flex flex-col items-center text-center space-y-3 lg:mb-0">
                    <div th:classappend="${entry.value == 0} ? 'bg-[#D9D9D9]' : 'bg-[#3DE382]'" class="w-20 h-20 lg:w-25 lg:h-25 rounded-full flex items-center justify-center text-white text-2xl shadow-lg">
                        <img src="/admin/images/open-book.png" alt="Checkmark" class="w-10 h-10 lg:w-12 lg:h-12">
                    </div>
                    <div>
                        <div class="font-bold text-gray-800 text-lg lg:text-2xl" th:text="${entry.key}"></div>
                        <div class="text-xs lg:text-md mb-4 md:mb-7" th:text="${entry.value == 0 ? 'Not Submitted' : 'Submitted'}"></div>
                        <div class="text-xs lg:text-xs font-semibold text-gray-800">Available Students Data</div>
                        <div class="text-3xl lg:text-[2.5rem] font-bold text-gray-800" th:text="${entry.value}"></div>
                    </div>
                </div>
            </div>
        </section>

        <form th:action="@{/admin/submit-data}" method="post" enctype="multipart/form-data" class="flex flex-col justify-center text-center mt-6" onsubmit="handleSubmit(event)">
            <!-- Upload Sections -->
            <div class="bg-[#B8D7FF] rounded-3xl grid grid-cols-1 md:grid-cols-2 place-items-center gap-6 md:gap-10 mb-4 p-8 md:px-[6rem] md:py-[3rem]" style="box-shadow: 0px 2px 27px -5px rgba(0,0,0,0.2);">
                <!-- Student Data -->
                <div class="border-2 w-11/12 border-dashed border-black rounded-2xl p-8 text-center bg-gray-50/50 hover:border-indigo-500 transition-all duration-300 group">
                    <img src="/admin/images/uploading.png" alt="Student Icon" class="w-10 h-10 mx-auto mb-6">
                    <h3 class="text-xl font-semibold text-gray-800 mb-6">Student Data</h3>

                    <!-- File Input -->
                    <div class="relative">
                        <label
                                for="fileInput-student-data"
                                class="block w-full bg-blue-100 border-2 border-dashed border-blue-300 text-blue-600 rounded-lg p-4 text-center text-sm cursor-pointer hover:bg-blue-200"
                        >
                                <span id="fileLabel-student-data">
                                    <img src="/admin/images/file-xlsx.png" alt="Upload Icon" class="inline-block w-6 h-6 mr-1"> Max upload size: 5MB
                                </span>
                        </label>
                        <input
                                id="fileInput-student-data"
                                type="file"
                                name="student-data"
                                accept=".xlsx"
                                class="hidden"
                                onchange="document.getElementById('fileLabel-student-data').innerHTML = this.files[0]?.name
                                ?  this.files[0].name
                                : '<img src=&quot;/admin/images/file-xlsx.png&quot; alt=&quot;Upload Icon&quot; class=&quot;inline-block w-6 h-6 mr-1&quot;> Max upload size: 5MB';"

                        />
                    </div>
                </div>

                <!-- Institute Requirements -->
                <div class="border-2 w-11/12 border-dashed border-black rounded-2xl p-8 text-center bg-gray-50/50 hover:border-indigo-500 transition-all duration-300 group">
                    <img src="/admin/images/uploading.png" alt="Student Icon" class="w-10 h-10 mx-auto mb-6">
                    <h3 class="text-xl font-semibold text-gray-800 mb-6">Institute Requirements</h3>

                    <!-- File Input -->
                    <div class="relative">
                        <label
                                for="fileInput-institute-requirements"
                                class="block w-full bg-blue-100 border-2 border-dashed border-blue-300 text-blue-600 rounded-lg p-4 text-center text-sm cursor-pointer hover:bg-blue-200"
                        >
                                <span id="fileLabel-institute-requirements">
                                    <img src="/admin/images/file-xlsx.png" alt="Upload Icon" class="inline-block w-6 h-6 mr-1"> Max upload size: 5MB
                                </span>
                        </label>
                        <input
                                id="fileInput-institute-requirements"
                                type="file"
                                name="institute-requirements"
                                accept=".xlsx"
                                class="hidden"
                                onchange="document.getElementById('fileLabel-institute-requirements').innerHTML = this.files[0]?.name
                                ?  this.files[0].name
                                : '<img src=&quot;/admin/images/file-xlsx.png&quot; alt=&quot;Upload Icon&quot; class=&quot;inline-block w-6 h-6 mr-1&quot;> Max upload size: 5MB';"
                        />
                    </div>
                </div>

                <!-- Course Data -->
                <div class="border-2 w-11/12 border-dashed border-black rounded-2xl p-8 text-center bg-gray-50/50 hover:border-indigo-500 transition-all duration-300 group">
                    <img src="/admin/images/uploading.png" alt="Student Icon" class="w-10 h-10 mx-auto mb-6">
                    <h3 class="text-xl font-semibold text-gray-800 mb-6">Course Data</h3>

                    <!-- File Input -->
                    <div class="relative">
                        <label
                                for="fileInput-course-data"
                                class="block w-full bg-blue-100 border-2 border-dashed border-blue-300 text-blue-600 rounded-lg p-4 text-center text-sm cursor-pointer hover:bg-blue-200"
                        >
                                <span id="fileLabel-course-data">
                                    <img src="/admin/images/file-xlsx.png" alt="Upload Icon" class="inline-block w-6 h-6 mr-1"> Max upload size: 5MB
                                </span>
                        </label>
                        <input
                                id="fileInput-course-data"
                                type="file"
                                name="course-data"
                                accept=".xlsx"
                                class="hidden"
                                onchange="document.getElementById('fileLabel-course-data').innerHTML = this.files[0]?.name
                                ?  this.files[0].name
                                : '<img src=&quot;/admin/images/file-xlsx.png&quot; alt=&quot;Upload Icon&quot; class=&quot;inline-block w-6 h-6 mr-1&quot;> Max upload size: 5MB';"
                        />
                    </div>
                </div>

                <!-- Course Offerings -->
                <div class="border-2 w-11/12 border-dashed border-black rounded-2xl p-8 text-center bg-gray-50/50 hover:border-indigo-500 transition-all duration-300 group">
                    <img src="/admin/images/uploading.png" alt="Student Icon" class="w-10 h-10 mx-auto mb-6">
                    <h3 class="text-xl font-semibold text-gray-800 mb-6">Course Offerings</h3>

                    <!-- File Input -->
                    <div class="relative">
                        <label
                                for="fileInput-course-offerings"
                                class="block w-full bg-blue-100 border-2 border-dashed border-blue-300 text-blue-600 rounded-lg p-4 text-center text-sm cursor-pointer hover:bg-blue-200"
                        >
                                <span id="fileLabel-course-offerings">
                                    <img src="/admin/images/file-xlsx.png" alt="Upload Icon" class="inline-block w-6 h-6 mr-1"> Max upload size: 5MB
                                </span>
                        </label>
                        <input
                                id="fileInput-course-offerings"
                                type="file"
                                name="course-offerings"
                                accept=".xlsx"
                                class="hidden"
                                onchange="document.getElementById('fileLabel-course-offerings').innerHTML = this.files[0]?.name
                                ?  this.files[0].name
                                : '<img src=&quot;/admin/images/file-xlsx.png&quot; alt=&quot;Upload Icon&quot; class=&quot;inline-block w-6 h-6 mr-1&quot;> Max upload size: 5MB';"
                        />
                    </div>
                </div>
            </div>

            <!-- submit Button -->
            <button id="final-submit-btn" type="submit"
                    class="mx-auto text-white px-10 py-3 rounded-2xl text-xl font-semibold transition-all duration-300 transform hover:scale-105 hover:shadow-xl flex items-center justify-center gap-2"
                    style="background: linear-gradient(to right, #27AE60, #2ECC71); box-shadow: 0px 2px 27px -5px rgba(0,0,0,0.2);">
                <span id="button-text">Submit</span>
                <svg id="spinner" class="hidden animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
                     viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor"
                          d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                </svg>
            </button>
        </form>

        <!-- Toast Container -->
        <div id="toast-container" class="fixed top-6 right-6 z-50 space-y-2"></div>

        <script th:inline="javascript">
            /*<![CDATA[*/
            var toastCounter = 0;

            function createToast(type, messages) {
              const container = document.getElementById('toast-container');
              const toastId = `toast-${++toastCounter}`;

              const toast = document.createElement('div');
              toast.id = toastId;
              toast.className = `max-w-xs lg:max-w-lg text-sm text-white rounded-xl shadow-lg transform transition-all duration-300 ease-in-out opacity-0 translate-x-full`;
              toast.setAttribute('role', 'alert');
              toast.setAttribute('tabindex', '-1');

              let bgColor = '';
              let icon = '';
              switch (type) {
                case 'success':
                  bgColor = 'bg-green-500';
                  icon = '✓';
                  break;
                case 'error':
                  bgColor = 'bg-red-500';
                  icon = '✕';
                  break;
                case 'warning':
                  bgColor = 'bg-yellow-500';
                  icon = '⚠';
                  break;
                default:
                  bgColor = 'bg-gray-500';
                  icon = 'ℹ';
              }

              toast.classList.add(bgColor);

              let content = `
                <div class="flex p-4 gap-3 items-start">
                  <span class="text-lg font-bold">${icon}</span>
                  <div class="flex-1">
              `;

              if (Array.isArray(messages)) {
                content += `<div class="space-y-1">`;
                messages.forEach(msg => {
                  content += `<div class="text-sm">${msg}</div>`;
                });
                content += `</div>`;
              } else {
                content += `<span class="text-sm">${messages}</span>`;
              }

              content += `
                  </div>
                  <button onclick="removeToast('${toastId}')" class="ml-2 text-white hover:text-gray-200 transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                  </button>
                </div>
              `;

              toast.innerHTML = content;
              container.appendChild(toast);

              setTimeout(() => {
                toast.classList.remove('opacity-0', 'translate-x-full');
                toast.classList.add('opacity-100', 'translate-x-0');
              }, 100);

              setTimeout(() => {
                removeToast(toastId);
              }, 7000);
            }

            function removeToast(toastId) {
              const toast = document.getElementById(toastId);
              if (toast) {
                toast.classList.add('opacity-0', 'translate-x-full');
                setTimeout(() => {
                  if (toast.parentNode) {
                    toast.parentNode.removeChild(toast);
                  }
                }, 300);
              }
            }

            function showToast(type, message) {
              createToast(type, message);
            }

            // === Safe Access from Thymeleaf JSON ===

            // UploadSuccess (status 200)
            const uploadSuccess = /*[[${uploadSuccess}]]*/ null;
            if (uploadSuccess && uploadSuccess.status === 200) {
              showToast('success', uploadSuccess.message);
            }

            // UploadWarning (status 299) with list of messages
            const uploadWarning = /*[[${uploadWarning}]]*/ null;
            if (uploadWarning && uploadWarning.status === 299) {
              createToast('warning', uploadWarning.message);
            }

            // UploadError
            const uploadError = /*[[${uploadError}]]*/ null;
            if (uploadError) {
              showToast('error', uploadError.message);
            }
            /*]]>*/
        </script>
    </main>
</div>


<script th:inline="javascript">
    const uploadError = [[${uploadError}]];
    const uploadWarning = [[${uploadWarning}]];
    const uploadSuccess = [[${uploadSuccess}]];
    const internalServerError = [[${internalServerError}]];
</script>

<script src="/common/js/general-utility.js"></script>
<script src="/common/js/navbar.js"></script>
<script src="/common/js/status-response.js"></script>
<script src="/admin/js/update-instance.js"></script>
</body>
</html>
